<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Armario Inteligente - Tu Estilista Personal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-shirt text-indigo-600 text-2xl"></i>
                <span class="font-bold text-lg tracking-tight">SmartWardrobe</span>
            </div>
            <div id="user-info" class="hidden flex items-center space-x-3">
                <span id="user-email-display" class="text-xs text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full"></span>
                <button onclick="logout()" class="text-xs text-red-600 hover:text-red-800 font-medium"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4">

        <!-- VISTA 1: REGISTRO / LOGIN LOCAL -->
        <section id="view-auth" class="max-w-md mx-auto mt-12 bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-slate-900">Tu Estilista de Bolsillo</h1>
                <p class="text-sm text-slate-500 mt-1">Guarda tu ropa en tu móvil y genera outfits automáticos según la ocasión.</p>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Tu Email o Nombre</label>
                    <input type="text" id="auth-input" required placeholder="ej. usuario@email.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition text-sm shadow-sm">Entrar a mi Armario</button>
            </form>
        </section>

        <!-- VISTA 2: APLICACIÓN PRINCIPAL -->
        <section id="view-app" class="hidden space-y-6">
            
            <!-- TABS DE NAVEGACIÓN -->
            <div class="flex border-b border-slate-200">
                <button onclick="switchTab('wardrobe')" id="tab-wardrobe" class="flex-1 py-3 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 transition"><i class="fa-solid fa-vest mr-2"></i> Mi Armario (<span id="count-items">0</span>)</button>
                <button onclick="switchTab('generator')" id="tab-generator" class="flex-1 py-3 text-sm font-semibold text-slate-400 hover:text-slate-600 transition"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Generar Outfit</button>
            </div>

            <!-- SECCIÓN: MI ARMARIO -->
            <div id="section-wardrobe" class="space-y-6">
                <!-- Formulario Añadir Prenda -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h2 class="font-bold text-slate-800 text-sm mb-4"><i class="fa-solid fa-plus-circle text-indigo-600 mr-1"></i> Añadir Nueva Prenda</h2>
                    <form id="item-form" onsubmit="addGarment(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs text-slate-500 mb-1 font-medium">Categoría</label>
                            <select id="item-category" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm bg-white">
                                <option value="superior">Parte Superior (Camisa, Camiseta...)</option>
                                <option value="inferior">Parte Inferior (Pantalón, Falda...)</option>
                                <option value="calzado">Calzado</option>
                                <option value="accesorio">Accesorio / Abrigo</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-500 mb-1 font-medium">Estilo</label>
                            <select id="item-style" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm bg-white">
                                <option value="casual">Casual / Diario</option>
                                <option value="formal">Formal / Elegante</option>
                                <option value="sport">Sport / Deportivo</option>
                                <option value="fiesta">Fiesta / Noche</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-500 mb-1 font-medium">Foto o Imagen</label>
                            <input type="file" id="item-image" accept="image/*" required class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        </div>
                        <div class="sm:col-span-3">
                            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-xl text-sm transition">Guardar en mi Dispositivo</button>
                        </div>
                    </form>
                </div>

                <!-- Listado de Prendas -->
                <div id="wardrobe-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <!-- Las prendas se cargan dinámicamente aquí -->
                </div>
            </div>

            <!-- SECCIÓN: GENERADOR DE OUTFITS -->
            <div id="section-generator" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center max-w-lg mx-auto">
                    <h2 class="font-bold text-slate-800 text-lg mb-2">¿Qué ocasión tienes hoy?</h2>
                    <p class="text-xs text-slate-500 mb-4">Selecciona el estilo deseado y deja que el sistema combine tus prendas.</p>
                    
                    <div class="flex justify-center gap-2 mb-6 flex-wrap">
                        <button onclick="generateOutfit('casual')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition">Casual</button>
                        <button onclick="generateOutfit('formal')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition">Formal</button>
                        <button onclick="generateOutfit('sport')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition">Sport</button>
                        <button onclick="generateOutfit('fiesta')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition">Fiesta</button>
                    </div>

                    <div id="outfit-result" class="hidden border-2 border-dashed border-slate-200 rounded-2xl p-4">
                        <h3 class="font-bold text-sm text-indigo-600 mb-3"><i class="fa-solid fa-star"></i> Tu Mix Recomendado</h3>
                        <div id="outfit-pieces" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4">
                            <!-- Piezas combinadas -->
                        </div>
                        <button onclick="generateOutfit(currentOccasion)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-medium transition">Probar otro mix</button>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <!-- SCRIPT DE FUNCIONAMIENTO -->
    <script>
        let currentUser = localStorage.getItem('smart_user');
        let wardrobe = JSON.parse(localStorage.getItem('smart_wardrobe') || '[]');
        let currentOccasion = 'casual';

        if (currentUser) {
            initApp();
        }

        function handleAuth(e) {
            e.preventDefault();
            const val = document.getElementById('auth-input').value.trim();
            if(!val) return;
            currentUser = val;
            localStorage.setItem('smart_user', currentUser);
            initApp();
        }

        function logout() {
            localStorage.removeItem('smart_user');
            currentUser = null;
            document.getElementById('view-app').classList.add('hidden');
            document.getElementById('view-auth').classList.remove('hidden');
            document.getElementById('user-info').classList.add('hidden');
        }

        function initApp() {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('view-app').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('user-email-display').innerText = currentUser;
            renderWardrobe();
        }

        function switchTab(tab) {
            if(tab === 'wardrobe') {
                document.getElementById('section-wardrobe').classList.remove('hidden');
                document.getElementById('section-generator').classList.add('hidden');
                document.getElementById('tab-wardrobe').className = "flex-1 py-3 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";
                document.getElementById('tab-generator').className = "flex-1 py-3 text-sm font-semibold text-slate-400 hover:text-slate-600 transition";
            } else {
                document.getElementById('section-wardrobe').classList.add('hidden');
                document.getElementById('section-generator').classList.remove('hidden');
                document.getElementById('tab-generator').className = "flex-1 py-3 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";
                document.getElementById('tab-wardrobe').className = "flex-1 py-3 text-sm font-semibold text-slate-400 hover:text-slate-600 transition";
            }
        }

        function addGarment(e) {
            e.preventDefault();
            const category = document.getElementById('item-category').value;
            const style = document.getElementById('item-style').value;
            const fileInput = document.getElementById('item-image');

            const file = fileInput.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                const newItem = {
                    id: Date.now(),
                    category,
                    style,
                    image: uploadEvent.target.result
                };
                wardrobe.push(newItem);
                localStorage.setItem('smart_wardrobe', JSON.stringify(wardrobe));
                document.getElementById('item-form').reset();
                renderWardrobe();
            };
            reader.readAsDataURL(file);
        }

        function deleteItem(id) {
            wardrobe = wardrobe.filter(item => item.id !== id);
            localStorage.setItem('smart_wardrobe', JSON.stringify(wardrobe));
            renderWardrobe();
        }

        function renderWardrobe() {
            document.getElementById('count-items').innerText = wardrobe.length;
            const grid = document.getElementById('wardrobe-grid');
            grid.innerHTML = '';

            if(wardrobe.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 text-sm">Tu armario está vacío. Sube tu primera prenda arriba.</div>`;
                return;
            }

            wardrobe.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-white p-2 rounded-xl border border-slate-100 shadow-sm relative group">
                        <img src="${item.image}" class="w-full h-32 object-cover rounded-lg mb-2">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-semibold capitalize text-slate-700">${item.category}</span>
                            <span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-[10px] capitalize">${item.style}</span>
                        </div>
                        <button onclick="deleteItem(${item.id})" class="absolute top-3 right-3 bg-white/80 hover:bg-red-600 hover:text-white text-slate-600 w-7 h-7 rounded-full flex items-center justify-center text-xs shadow transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function generateOutfit(occasion) {
            currentOccasion = occasion;
            const superiors = wardrobe.filter(i => i.category === 'superior' && (i.style === occasion || i.style === 'casual'));
            const inferiors = wardrobe.filter(i => i.category === 'inferior' && (i.style === occasion || i.style === 'casual'));
            const shoes = wardrobe.filter(i => i.category === 'calzado');
            const accessories = wardrobe.filter(i => i.category === 'accesorio');

            const resultDiv = document.getElementById('outfit-result');
            const piecesDiv = document.getElementById('outfit-pieces');
            piecesDiv.innerHTML = '';

            if(superiors.length === 0 || inferiors.length === 0) {
                resultDiv.classList.remove('hidden');
                piecesDiv.innerHTML = `<div class="col-span-full text-xs text-red-500">Necesitas al menos una prenda superior y una inferior de estilo '${occasion}' (o casual) en tu armario para generar un mix.</div>`;
                return;
            }

            const randomSup = superiors[Math.floor(Math.random() * superiors.length)];
            const randomInf = inferiors[Math.floor(Math.random() * inferiors.length)];
            const randomShoe = shoes.length > 0 ? shoes[Math.floor(Math.random() * shoes.length)] : null;
            const randomAcc = accessories.length > 0 ? accessories[Math.floor(Math.random() * accessories.length)] : null;

            let html = `
                <div class="bg-slate-50 p-2 rounded-lg border border-slate-100 text-center">
                    <img src="${randomSup.image}" class="w-full h-24 object-cover rounded mb-1">
                    <span class="text-[10px] font-medium text-slate-600">Parte Superior</span>
                </div>
                <div class="bg-slate-50 p-2 rounded-lg border border-slate-100 text-center">
                    <img src="${randomInf.image}" class="w-full h-24 object-cover rounded mb-1">
                    <span class="text-[10px] font-medium text-slate-600">Parte Inferior</span>
                </div>
            `;

            if(randomShoe) {
                html += `
                    <div class="bg-slate-50 p-2 rounded-lg border border-slate-100 text-center">
                        <img src="${randomShoe.image}" class="w-full h-24 object-cover rounded mb-1">
                        <span class="text-[10px] font-medium text-slate-600">Calzado</span>
                    </div>
                `;
            }

            piecesDiv.innerHTML = html;
            resultDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
